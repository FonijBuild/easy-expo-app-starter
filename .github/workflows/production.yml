name: EAS production build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm dlx eas-cli@21.3.0 build --platform all --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
